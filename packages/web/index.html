<!doctype html>
<html lang="en" data-font="sans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Pre-hydration only: App.tsx replaces this with "owner/repo | ntwine" once the board arrives. -->
    <title>ntwine</title>
    <!-- Own Dock/tab identity. The SVG favicon is preferred by modern browsers; the PNGs are the
         fallback + the source Chrome rasterizes into the macOS app icon when the app is installed
         ("Install ntwine…" / Create Shortcut → Open as window), which is the only way a Chrome-hosted
         window gets its own Dock name+icon (a plain --app window is owned by Chrome). -->
    <!-- ?v= is a cache-buster: Chrome caches favicons per-URL for a long time, so an icon EDIT at the
         same path keeps showing the stale cached copy (a hard-quit doesn't clear it). Bump this whenever
         the icon art changes so the browser refetches. v7: ntwine — three threads plaited. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=9" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=9" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=9" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=9" />
    <!-- use-credentials: a manifest is fetched WITHOUT cookies unless this says otherwise, even from its
         own origin. Over the tunnel every request without a session gets the 401 page, so Chrome read
         that page as the manifest and could only offer a bookmark, never "Install app". -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <!-- iOS names a Home Screen app after the page title, which App.tsx sets to "owner/repo | ntwine". -->
    <meta name="apple-mobile-web-app-title" content="ntwine" />
    <meta name="theme-color" content="#0d0e10" />
    <!-- FLASH GUARD, and it is about NAVIGATION rather than first run. Switching projects was once
         a real document load (each board binds its own socket, board store and API base to
         one project, so a full load is how all three get re-bound in one step) — and the browser
         paints its default canvas for the frame before the module CSS arrives. That default is WHITE,
         so every project switch strobed. Resolve this browser's appearance before paint; the inline
         canvas rules need no stylesheet, with an OS fallback if JavaScript is unavailable. -->
    <meta name="color-scheme" content="dark light" />
    <style>
      html, body { background: #0d0e10; }
      html[data-theme="light"], html[data-theme="light"] body { background: #f7f7f7; }
      @media (prefers-color-scheme: light) { html:not([data-theme]), html:not([data-theme]) body { background: #f7f7f7; } }
      html[data-host-colors="sideBar"], html[data-host-colors="sideBar"] body { background: var(--vscode-sideBar-background); }
      html[data-host-colors="editor"], html[data-host-colors="editor"] body { background: var(--vscode-editor-background); }
    </style>
    <!-- …and in an editor's sidebar the EDITOR's theme wins (src/lib/embed.ts, which this mirrors: the
         `embed`/`theme` query on the frame's first address, else the frame's `ntwine.embed` session
         record). Without it the sidebar painted the stored or OS theme first and flipped a beat later. -->
    <script>
      let ntwineThemePreference
      try { ntwineThemePreference = localStorage.getItem("ntwine-theme") } catch {}
      let ntwineSystemDark = false
      try { ntwineSystemDark = typeof matchMedia === "function" && matchMedia("(prefers-color-scheme: dark)").matches } catch {}
      let ntwineEmbed = null
      try {
        const record = JSON.parse(sessionStorage.getItem("ntwine.embed") || "null")
        const query = new URLSearchParams(location.search)
        if (query.get("embed") === "vscode") ntwineEmbed = { host: "vscode", theme: query.get("theme"), palette: record && record.host === "vscode" ? record.palette : undefined }
        else ntwineEmbed = record
      } catch {}
      if (ntwineEmbed && ntwineEmbed.host === "vscode") {
        document.documentElement.dataset.embed = "vscode"
        if (ntwineEmbed.theme === "dark" || ntwineEmbed.theme === "light") ntwineThemePreference = ntwineEmbed.theme
        // The editor's COLOURS (src/lib/embed.ts parsePalette, which this mirrors — the names and the value
        // pattern are packages/shared embed-protocol.ts's, and embed.test.ts holds the two in step). The
        // relay puts its first theme message on the frame's address as a fragment, so the very first paint
        // wears them; it is written to the session record, where embed.ts takes it over, and dropped from
        // the address. A reload of the frame then finds the latest in the record.
        try {
          const hash = location.hash || ""
          if (hash.startsWith("#ntwine-theme=")) {
            const sent = JSON.parse(decodeURIComponent(hash.slice("#ntwine-theme=".length)))
            ntwineEmbed.palette = sent && typeof sent === "object" && sent.colors ? { colors: sent.colors, surface: sent.surface, contrast: sent.contrast } : undefined
            sessionStorage.setItem("ntwine.embed", JSON.stringify(ntwineEmbed))
            history.replaceState(history.state, "", location.pathname + location.search)
          }
        } catch {}
        const palette = ntwineEmbed.palette
        const colors = palette && typeof palette === "object" ? palette.colors : null
        const surface = palette && palette.surface === "editor" ? "editor" : "sideBar"
        const color = /^(?:#(?:[0-9a-fA-F]{3,4}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})|rgba?\(\s*[0-9.]+%?\s*[,\s]\s*[0-9.]+%?\s*[,\s]\s*[0-9.]+%?\s*(?:[,/]\s*[0-9.]+%?\s*)?\))$/u
        const ok = (value) => typeof value === "string" && value.length <= 64 && color.test(value)
        if (colors && typeof colors === "object" && ok(colors[surface + "-background"])) {
          for (const name of ["sideBar-background", "sideBar-foreground", "editor-background", "foreground", "descriptionForeground", "panel-border", "contrastBorder", "input-border", "list-hoverBackground", "button-background", "button-foreground", "focusBorder", "textLink-foreground", "scrollbarSlider-background", "scrollbarSlider-hoverBackground"]) if (ok(colors[name])) document.documentElement.style.setProperty("--vscode-" + name, colors[name])
          document.documentElement.dataset.hostColors = surface
          if (palette.contrast === true) document.documentElement.dataset.hostContrast = ""
        }
      }
      const ntwineTheme = ntwineThemePreference === "dark" || ntwineThemePreference === "light" ? ntwineThemePreference : ntwineSystemDark ? "dark" : "light"
      document.documentElement.dataset.theme = ntwineTheme
      document.documentElement.style.colorScheme = ntwineTheme
      document.querySelector('meta[name="theme-color"]')?.setAttribute("content", ntwineTheme === "dark" ? "#0d0e10" : "#f7f7f7")
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
